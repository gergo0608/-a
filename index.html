<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Áďo, miluješ mě?</title>
<style>
:root{--bg:#ffe9ef;--fg:#5a1a2e;--card:#fff;--yes:#e63e6d;--no:#8a8a99;--shadow:rgba(230,62,109,.25);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1220;--fg:#ffd9e4;--card:#3b1a2d;--yes:#ff5c8a;--no:#6c6c7c;--shadow:rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#2a1220;--fg:#ffd9e4;--card:#3b1a2d;--yes:#ff5c8a;--no:#6c6c7c;--shadow:rgba(0,0,0,.4)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border-radius:28px;padding:26px 20px;max-width:440px;width:calc(100% - 32px);text-align:center;box-shadow:0 12px 40px var(--shadow)}
.emoji{font-size:68px;line-height:1.1;min-height:76px}
h1{font-size:25px;margin:8px 0 12px;min-height:32px}
.arena{position:relative;height:300px;margin:0 auto}
button{position:absolute;font:inherit;font-weight:600;border:0;border-radius:999px;padding:11px 24px;color:#fff;cursor:pointer;touch-action:manipulation;transition:transform .12s}
button:active{transform:scale(.94)}
.dots{margin-top:10px;font-size:14px;min-height:20px;opacity:.8}
.final p{font-size:25px;line-height:1.4;margin:10px 0}
.sign{font-weight:700;color:var(--yes)}
.it{margin-top:20px;padding:14px 16px;border:2px dashed var(--yes);border-radius:18px;font-size:20px}
.it b{font-size:30px;letter-spacing:4px;color:var(--yes)}
.hidden{display:none}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.pop{animation:pop .35s}
</style>
</head>
<body>
<div class="card">
  <div id="main">
    <div class="emoji pop" id="emoji">🥰</div>
    <h1 id="q">Áďo, miluješ mě?</h1>
    <div class="arena" id="arena"></div>
    <div class="dots" id="dots"></div>
  </div>
  <div class="final hidden" id="final">
    <div class="emoji pop">🧸❤️</div>
    <p>Já tě taky mám strašně rád,</p>
    <p class="sign">Tvůj Medvídek Fíla</p>
    <div class="it">A teď mi napiš slovo<br><b>IT</b> 💌</div>
  </div>
</div>
<script>
const questions=[
  "Áďo, miluješ mě?","Opravdu?","Myslíš to vážně?","Fakt fakt?","Určitě určitě?",
  "A nelžeš mi?","Přísaháš na medvědí tlapku?","Úplně celým srdíčkem?",
  "Ani trošičku pochybností?","Tak naposledy – opravdu opravdu?"
];
const happy=["🥰","😊","🤔","😳","😍","🥹","🐻","💕","😘","🧸"];
const decoys=["Možná","Nevím","Asi ne","Hmm"];
let step=0,busy=false;
const $=id=>document.getElementById(id);
const q=$("q"),emoji=$("emoji"),dots=$("dots"),arena=$("arena");

function overlap(a,b){return a.x<b.x+b.w+8&&b.x<a.x+a.w+8&&a.y<b.y+b.h+8&&b.y<a.y+a.h+8;}

function build(){
  arena.innerHTML="";
  // čím dál víc tlačítek: od 4. otázky přibývají falešná tlačítka
  const extra=step<3?0:step<6?1:step<8?2:3;
  const list=[{t:"Ano",yes:true},{t:"Ne"}];
  const pool=decoys.slice().sort(()=>Math.random()-.5);
  for(let i=0;i<extra;i++)list.push({t:pool[i]});
  // od 2. otázky je růžová barva občas pod jiným tlačítkem než Ano
  const others=list.filter(i=>!i.yes);
  const pink=(step>0&&Math.random()<0.5)?others[Math.floor(Math.random()*others.length)]:list[0];
  const placed=[];
  list.forEach(item=>{
    const b=document.createElement("button");
    b.textContent=item.t;
    const fs=14+Math.floor(Math.random()*9);
    b.style.fontSize=fs+"px";
    b.style.background=item===pink?"var(--yes)":"var(--no)";
    b.onclick=item.yes?onYes:onNo;
    b.style.visibility="hidden";
    arena.appendChild(b);
    item.el=b;
  });
  const W=arena.clientWidth,H=arena.clientHeight;
  list.sort(()=>Math.random()-.5).forEach(item=>{
    const b=item.el,w=b.offsetWidth,h=b.offsetHeight;
    let r,t=0;
    do{r={x:Math.random()*(W-w),y:Math.random()*(H-h),w,h};t++;}
    while(t<300&&placed.some(p=>overlap(r,p)));
    placed.push(r);
    b.style.left=r.x+"px";b.style.top=r.y+"px";b.style.visibility="visible";
  });
}
function render(){
  q.textContent=questions[step];
  emoji.textContent=happy[step];
  emoji.classList.remove("pop");void emoji.offsetWidth;emoji.classList.add("pop");
  dots.textContent=step?"❤️".repeat(step):"";
  build();
}
function onYes(){
  if(busy)return;
  step++;
  if(step>=questions.length){
    $("main").classList.add("hidden");
    $("final").classList.remove("hidden");
    return;
  }
  render();
}
function onNo(){
  if(busy)return;
  busy=true;
  arena.innerHTML="";
  emoji.textContent="😢";
  emoji.classList.remove("pop");void emoji.offsetWidth;emoji.classList.add("pop");
  q.textContent="Tak to je smutné…";
  dots.textContent="";
  setTimeout(()=>{step=0;busy=false;render();},1600);
}
window.addEventListener("resize",build);
render();
</script>
</body>
</html>
